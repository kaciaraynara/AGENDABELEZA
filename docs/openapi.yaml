components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthResponse:
      type: object
      required:
        - status
        - app
        - timestamp
        - uptime
      properties:
        status:
          type: string
          example: ok
        app:
          type: string
          example: AgendaBeleza API
        timestamp:
          type: string
          format: date-time
        uptime:
          type: number
          example: 142.58
        environment:
          type: string
          example: development

    PublicSalon:
      type: object
      required:
        - id
        - name
        - slug
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: SalÃ£o das Flores
        slug:
          type: string
          example: salao-das-flores
        phone:
          type: string
          example: "88999435418"
        address:
          type: string
          example: Av. Principal, 100 - Centro

    ServiceItem:
      type: object
      required:
        - id
        - name
        - price
        - durationMinutes
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Corte e Escova
        price:
          type: number
          example: 80.0
        durationMinutes:
          type: integer
          example: 60

    CreatePublicAppointmentRequest:
      type: object
      required:
        - clientName
        - clientPhone
        - serviceId
        - professionalId
        - date
      properties:
        clientName:
          type: string
          minLength: 2
          example: Maria Silva
        clientPhone:
          type: string
          example: "88999990000"
        serviceId:
          type: string
          format: uuid
        professionalId:
          type: string
          format: uuid
        date:
          type: string
          format: date-time
          example: "2026-11-12T14:00:00.000Z"

    AppointmentResponse:
      type: object
      required:
        - id
        - status
        - date
      properties:
        id:
          type: string
          format: uuid
        clientName:
          type: string
          example: Maria Silva
        status:
          type: string
          enum: [PENDING, CONFIRMED, COMPLETED, CANCELED]
          example: PENDING
        date:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            name:
              type: string
              example: NotFound
            message:
              type: string
              example: Recurso nÃ£o encontrado
            code:
              type: string
              example: ROUTE_NOT_FOUND