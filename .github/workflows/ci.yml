name: CI - AgendaBeleza

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    name: Build, Lint & Test (Backend)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: adminpassword
          POSTGRES_DB: agendabeleza_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d agendabeleza_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: ./backend

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://admin:adminpassword@localhost:5432/agendabeleza_test?schema=public
      JWT_SECRET: test-jwt-secret-ci
      MERCADOPAGO_ACCESS_TOKEN: TEST-0000000000000000-000000-00000000000000000000000000000000-000000000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Apply database migrations
        run: npx prisma db push --accept-data-loss

      - name: Lint & Typecheck
        run: npm run lint

      - name: Build TypeScript
        run: npm run build

      - name: Run Automated Tests with Coverage
        run: npm run test:coverage
